apply plugin: 'com.android.application'

// HERE XYZ Hub access token 由 local.properties（不進版控）或環境變數注入，
// 避免把金鑰寫死在原始碼。設定方式見 README。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def hereXyzToken = localProps.getProperty('here.xyz.token', System.getenv('HERE_XYZ_TOKEN') ?: '')
def hereAppId = localProps.getProperty('here.app.id', System.getenv('HERE_APP_ID') ?: '')
def hereAppCode = localProps.getProperty('here.app.code', System.getenv('HERE_APP_CODE') ?: '')
def hereLicenseKey = localProps.getProperty('here.license.key', System.getenv('HERE_LICENSE_KEY') ?: '')

android {
    compileSdkVersion 30
    splits {
        abi {
            enable true
            reset()
            include "x86", "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    defaultConfig {
        applicationId 'com.fancynavi.android.app'
        minSdkVersion 26

        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        // 透過 BuildConfig 取用，原始碼不再出現明文金鑰
        buildConfigField "String", "HERE_XYZ_TOKEN", "\"${hereXyzToken}\""
        buildConfigField "String", "HERE_APP_ID", "\"${hereAppId}\""
        buildConfigField "String", "HERE_APP_CODE", "\"${hereAppCode}\""
        buildConfigField "String", "HERE_LICENSE_KEY", "\"${hereLicenseKey}\""
    }
    dataBinding {
        enabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.android.gms:play-services-location:18.0.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.cocoahero.android:geojson:1.0.1@jar'
    implementation 'com.android.volley:volley:1.2.1'
}
